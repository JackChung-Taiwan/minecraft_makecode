name: Apply MakeCode fallback buttons

on:
  push:
    paths:
      - .github/workflows/apply-makecode-fallback.yml

permissions:
  contents: write

jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch index
        run: python .github/patch_makecode_fallback.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add online import and MakeCode backup download"
          git push origin main
