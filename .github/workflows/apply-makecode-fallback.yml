name: Apply MakeCode fallback buttons

on:
  push:
    paths:
      - ".github/workflows/apply-makecode-fallback.yml"

permissions:
  contents: write

jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Add online import and backup download buttons
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Could not find expected section: {label}")
              return text.replace(old, new, 1)

          old_top = '''      <div class="complete-actions">
                <button
                  class="btn btn-copy"
                  type="button"
                  data-copy="https://makecode.com/_Ukx7TcL852Pz">
                  複製連結
                </button>
              </div>'''
          new_top = '''      <div class="complete-actions">
                <a class="btn btn-online" href="https://makecode.com/_Ukx7TcL852Pz" target="_blank" rel="noopener">線上匯入</a>
                <a class="btn btn-download" href="./downloads/haiyang-zongdongyuan.mkcd" download="海洋總動員.mkcd">下載備援程式</a>
              </div>'''

          # The live file uses 8-space indentation in this section. Fall back to the exact
          # indentation currently present if the more-indented variant is not found.
          if old_top not in text:
              old_top = '''      <div class="complete-actions">
        <button
          class="btn btn-copy"
          type="button"
          data-copy="https://makecode.com/_Ukx7TcL852Pz">
          複製連結
        </button>
      </div>'''
              new_top = '''      <div class="complete-actions">
        <a class="btn btn-online" href="https://makecode.com/_Ukx7TcL852Pz" target="_blank" rel="noopener">線上匯入</a>
        <a class="btn btn-download" href="./downloads/haiyang-zongdongyuan.mkcd" download="海洋總動員.mkcd">下載備援程式</a>
      </div>'''
          text = replace_once(text, old_top, new_top, "main 海洋總動員 actions")

          old_card = '''  <div class="link-card__actions">
    <button class="btn btn-copy" type="button" data-copy="https://makecode.com/_Ukx7TcL852Pz" aria-label="複製海洋總動員程式連結">複製連結</button>
  </div>'''
          new_card = '''  <div class="link-card__actions">
    <a class="btn btn-online" href="https://makecode.com/_Ukx7TcL852Pz" target="_blank" rel="noopener">線上匯入</a>
    <a class="btn btn-download" href="./downloads/haiyang-zongdongyuan.mkcd" download="海洋總動員.mkcd">下載備援程式</a>
  </div>'''
          text = replace_once(text, old_card, new_card, "海洋總動員 link card")

          old_fallback = '''    <div class="import-fallback">
      <strong>若匯入出現錯誤：</strong>
      請重新開啟 MakeCode 後，再匯入一次。
    </div>'''
          new_fallback = '''    <div class="import-fallback">
      <strong>若線上匯入出現「網路請求失敗」：</strong>
      請點「下載備援程式」，再於 MakeCode 選擇「匯入 → 匯入檔案」。
    </div>'''
          text = replace_once(text, old_fallback, new_fallback, "fallback instructions")

          css_marker = '.btn-copy{background:#ffd34d;color:#2b2415;border:2px solid #a47600}'
          css_new = css_marker + '''
  .btn-online{background:#2f9e36;color:#fff;border:2px solid #176a23}
  .btn-online:hover{background:#27862e}
  .btn-download{background:#6b28c9;color:#fff;border:2px solid #46158f}
  .btn-download:hover{background:#5720aa}'''
          text = replace_once(text, css_marker, css_new, "button styles")

          if text.count('下載備援程式') < 3:
              raise SystemExit("Backup download text was not added as expected")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit site update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index.html changes to commit."
            exit 0
          fi
          git commit -m "Add online import and MakeCode backup download"
          git push origin main
