name: Change online import to copy link

on:
  push:
    paths:
      - ".github/workflows/change-online-to-copy.yml"

permissions:
  contents: write

jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Replace online buttons with copy buttons
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old = '<a class="btn btn-online" href="https://makecode.com/_Ukx7TcL852Pz" target="_blank" rel="noopener">線上匯入</a>'
          new = '<button class="btn btn-copy" type="button" data-copy="https://makecode.com/_Ukx7TcL852Pz">複製連結</button>'

          count = text.count(old)
          if count < 1:
              raise SystemExit('找不到線上匯入按鈕')

          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          print(f'Replaced {count} button(s)')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Change MakeCode online import to copy link" || exit 0
          git push origin main
