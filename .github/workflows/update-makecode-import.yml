name: Update MakeCode import tutorial

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-makecode-import.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update MakeCode import section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          checks = [
              ('遊樂園設施（完整匯入）', 1),
              ('<p>一次匯入完整遊樂園設施程式。</p>', 1),
              ('https://makecode.com/_3x7htc2Wq7zg', 2),
          ]
          for needle, expected in checks:
              actual = text.count(needle)
              if actual != expected:
                  raise SystemExit(f'Expected {expected} occurrence(s) of {needle!r}, found {actual}')

          text = text.replace('遊樂園設施（完整匯入）', '海底總動員 (匯入教學)')
          text = text.replace('<p>一次匯入完整遊樂園設施程式。</p>', '')
          text = text.replace('https://makecode.com/_3x7htc2Wq7zg', 'https://makecode.com/_L6X9uMhkUH9t')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate changes
        shell: bash
        run: |
          git diff --check
          grep -Fq '海底總動員 (匯入教學)' index.html
          grep -Fq 'https://makecode.com/_L6X9uMhkUH9t' index.html
          ! grep -Fq '一次匯入完整遊樂園設施程式' index.html
          ! grep -Fq 'https://makecode.com/_3x7htc2Wq7zg' index.html

      - name: Commit update
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: update MakeCode import tutorial'
          git push
